name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: xva_risk_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xva_risk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRFLOW_CONN_XVA_TEST_POSTGRES: postgresql://postgres@127.0.0.1:5432/xva_risk_test
      XVA_TEST_POSTGRES_CONN_ID: xva_test_postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      
      - name: Install Airflow
        run: |
          AIRFLOW_VERSION=3.3.2
          PYTHON_VERSION=3.10
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

          python -m pip install --upgrade pip
          python -m pip install \
            "apache-airflow[postgres]==${AIRFLOW_VERSION}" \
            --constraint "${CONSTRAINT_URL}"


      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,graph]"
          python -m pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest \
            --cov=risk_pipeline \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

      - name: Set up Node.js for the graph demo
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/dag-viewer/package-lock.json

      - name: Build graph viewer and test read-only browser interactions
        working-directory: web/dag-viewer
        env:
          XVA_DEMO_PYTHON: python
          AIRFLOW_HOME: /tmp/xva-graph-ci
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
