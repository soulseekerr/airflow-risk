[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-risk"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "requests>=2.32,<3"]
graph = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]